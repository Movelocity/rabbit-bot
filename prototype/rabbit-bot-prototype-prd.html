<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabbit Bot 管理台 · 原型 + PRD</title>
<style>
:root{
  --bg:#f6f3ec; --surface:#fffcf5; --surface2:#f0ece2; --surface3:#e9e4d8;
  --ink:#1b2620; --muted:#6d7a72; --faint:#97a29a;
  --line:#e3ddcf; --line-strong:#cfc7b6;
  --jade:#0e7a6b; --jade-ink:#075e53; --jade-soft:#dcefe9;
  --clay:#b4653a; --clay-soft:#f6e6db;
  --amber:#a86b12; --amber-soft:#f7ecd2;
  --rose:#b3403a; --rose-soft:#f8e3e0;
  --ok:#2f7d54; --ok-soft:#e0efe6;
  --shadow:0 1px 2px rgba(45,38,26,.05), 0 12px 28px -18px rgba(45,38,26,.35);
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151a17; --surface:#1c231f; --surface2:#232b26; --surface3:#2a342e;
    --ink:#e9eee9; --muted:#9aa79f; --faint:#74827a;
    --line:#2e3831; --line-strong:#3d4a41;
    --jade:#5cc4b2; --jade-ink:#8ee0d1; --jade-soft:#183c36;
    --clay:#e0a07d; --clay-soft:#3a2a22;
    --amber:#e0b15e; --amber-soft:#3a311f;
    --rose:#f08a82; --rose-soft:#3d2523;
    --ok:#66c48d; --ok-soft:#1b3527;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 28px -18px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed;opacity:.5}
a{color:var(--jade);text-decoration:none}
code,.mono{font-family:var(--mono)}
::selection{background:var(--jade-soft)}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

.app{height:100dvh;display:flex;flex-direction:column;min-height:0;transition:margin-right .18s ease}
body.prd .app{margin-right:420px}
body.prd .app-header{padding-left:42px}
body.prd .app-header > .pin{top:17px;left:10px}
body.prd .page{padding-top:54px}
body.prd .page.flush{padding-top:30px}
.app-header{flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;height:56px;border-bottom:1px solid var(--line);background:var(--surface);position:relative}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--jade);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:18px;font-weight:700;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.brand-name{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.header-tools{display:flex;align-items:center;gap:7px;margin-left:auto;min-width:0;font-size:12.5px;color:var(--muted)}
.health{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}
.sep{color:var(--line-strong)}
.origin{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11.5px}
.mode-switch{display:flex;align-items:center;padding:2px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);margin-left:4px}
.mode-switch button{padding:4px 9px;border-radius:7px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.mode-switch button.on{background:var(--surface);color:var(--jade-ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.main-tabs{flex:none;display:flex;align-items:center;gap:2px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.main-tabs::-webkit-scrollbar{display:none}
.main-tabs .tab{position:relative;padding:11px 15px 10px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;transition:color .12s ease}
.main-tabs .tab:hover{color:var(--ink)}
.main-tabs .tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--jade)}
.main-tabs .tab.on::after{content:"";position:absolute;left:15px;right:15px;bottom:-2px;height:2px;background:var(--jade);border-radius:2px}
.refresh-pill{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--muted);background:var(--surface);transition:.12s}
.refresh-pill:hover{border-color:color-mix(in srgb,var(--jade) 45%,var(--line));color:var(--jade);background:var(--jade-soft)}
.refresh-pill svg{width:13px;height:13px}
.app-main{flex:1;min-height:0;overflow:hidden}
.app-footer{flex:none;border-top:1px solid var(--line);background:var(--surface);padding:5px 18px;text-align:right;font-size:11.5px;color:var(--muted);min-height:27px}
.app-footer:empty{display:none}

.page{height:100%;overflow-y:auto;padding:22px clamp(16px,3.4vw,40px) 64px;position:relative}
.page.flush{overflow:hidden;padding:0}
.page-head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:2px 0 16px}
.page-head .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
.page-head h1{font-family:var(--serif);font-size:25px;line-height:1.15;margin:4px 0 0;letter-spacing:.01em}
.page-head .sub{margin:5px 0 0;color:var(--muted);font-size:12.5px;max-width:62ch}
.head-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.section-title{font-family:var(--serif);font-size:17px;margin:22px 0 10px;display:flex;align-items:baseline;gap:9px}
.section-title .count{font-family:inherit;font-size:12px;color:var(--muted);font-weight:400}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12px}
.tiny{font-size:11px}
.right{margin-left:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:9px;padding:7px 12px;background:var(--surface2);color:var(--ink);font-size:13px;transition:.12s;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.primary{background:var(--jade);color:#fff}
.btn.primary:hover{background:var(--jade-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{background:transparent;border-color:color-mix(in srgb,var(--rose) 40%,var(--line));color:var(--rose)}
.btn.danger:hover{background:var(--rose-soft)}
.btn.wide{width:100%}
.icon-btn{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}

.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:11px;color:var(--muted);white-space:nowrap;background:var(--surface)}
.chip.jade{border-color:color-mix(in srgb,var(--jade) 40%,var(--line));background:var(--jade-soft);color:var(--jade-ink);font-weight:600}
.chip.clay{border-color:color-mix(in srgb,var(--clay) 40%,var(--line));background:var(--clay-soft);color:var(--clay)}
.badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-size:10.5px;line-height:1.55;color:var(--muted);white-space:nowrap;background:var(--surface)}
.badge.ok{border-color:color-mix(in srgb,var(--ok) 38%,var(--line));background:var(--ok-soft);color:var(--ok)}
.badge.info{border-color:color-mix(in srgb,var(--jade) 38%,var(--line));background:var(--jade-soft);color:var(--jade-ink)}
.badge.warn{border-color:color-mix(in srgb,var(--amber) 40%,var(--line));background:var(--amber-soft);color:var(--amber)}
.badge.bad{border-color:color-mix(in srgb,var(--rose) 38%,var(--line));background:var(--rose-soft);color:var(--rose)}
.badge.muted{background:var(--surface2)}
.tag{display:inline-flex;align-items:center;border-radius:5px;padding:1px 6px;font-size:10.5px;font-family:var(--mono);border:1px solid var(--line);color:var(--muted);background:var(--surface2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card-pad{padding:14px 16px}
.card-head{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.card-title{font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.card-meta{display:flex;flex-wrap:wrap;gap:5px 12px;color:var(--muted);font-size:11.5px;margin-top:7px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 14px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line-strong)}
.kpi.jade::before{background:var(--jade)}
.kpi.amber::before{background:var(--amber)}
.kpi.rose::before{background:var(--rose)}
.kpi .label{font-size:11px;color:var(--muted);letter-spacing:.04em}
.kpi .value{font-family:var(--serif);font-size:25px;font-weight:700;line-height:1.2;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .note{font-size:11px;color:var(--faint);margin-top:2px}

.field{display:block;min-width:0}
.field > span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:7px 10px;outline:none;transition:.12s;min-width:0}
.input:focus,.select:focus,.textarea:focus{border-color:var(--jade);box-shadow:0 0 0 3px color-mix(in srgb,var(--jade) 15%,transparent)}
.textarea{resize:vertical;min-height:64px;line-height:1.6}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 10px) 52%;background-size:4px 4px;background-repeat:no-repeat;padding-right:28px}
.filterbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:9px;margin-bottom:12px}
.filterbar .field{width:130px}
.filterbar .field.grow{flex:1;min-width:190px;width:auto}
.segmented{display:inline-flex;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);gap:1px}
.segmented button{padding:3px 9px;border-radius:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.segmented button.on{background:var(--surface);color:var(--jade-ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.checkline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.checkline input{accent-color:var(--jade);width:15px;height:15px}

.table-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--surface)}
table.table{width:100%;border-collapse:collapse;font-size:12.5px}
.table th{position:sticky;top:0;z-index:1;background:var(--surface2);color:var(--muted);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
.table tr:last-child td{border-bottom:0}
.table tbody tr:hover td{background:color-mix(in srgb,var(--jade-soft) 30%,transparent)}
.table .num{font-variant-numeric:tabular-nums;white-space:nowrap}

.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:12.5px}
.notice{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--muted);line-height:1.6}
.notice.jade{background:var(--jade-soft);border-color:color-mix(in srgb,var(--jade) 30%,var(--line));color:var(--jade-ink)}
.hr{height:1px;background:var(--line);margin:12px 0}

/* chat */
.chat-layout{display:grid;grid-template-columns:288px minmax(0,1fr) 308px;height:100%;min-height:0}
.pool-rail{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--surface)}
.pool-rail-head{padding:16px 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.rail-count{font-size:11px;color:var(--muted);margin-top:1px}
.pool-search{padding:0 12px 9px}
.pool-search .input{padding:6px 10px;font-size:12px;border-radius:8px}
.pool-scroll{flex:1;min-height:0;overflow-y:auto;padding:0 8px 14px}
.pool-group-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:12px 8px 5px;font-weight:700}
.pool-row{display:flex;gap:9px;align-items:flex-start;width:100%;padding:9px 9px;border-radius:9px;text-align:left;position:relative;transition:background .12s}
.pool-row:hover{background:var(--surface2)}
.pool-row.on{background:var(--jade-soft)}
.pool-row.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--jade)}
.avatar{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:13px;flex:none;background:var(--surface3);color:var(--muted);border:1px solid var(--line)}
.avatar.private{background:var(--clay-soft);color:var(--clay);border-color:color-mix(in srgb,var(--clay) 25%,var(--line))}
.avatar.group{background:var(--jade-soft);color:var(--jade-ink);border-color:color-mix(in srgb,var(--jade) 25%,var(--line))}
.avatar.sm{width:24px;height:24px;border-radius:7px;font-size:11px}
.pool-info{min-width:0;flex:1}
.pool-title{display:flex;align-items:center;gap:5px;font-weight:600;font-size:12.5px;line-height:1.35}
.pool-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pool-sub{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:10.5px;margin-top:2px}
.pool-sub code{font-size:10px;color:var(--faint)}
.pool-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;font-size:10px;color:var(--faint)}
.unread{min-width:16px;height:16px;padding:0 5px;border-radius:9px;background:var(--clay);color:#fff;font-size:10px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.chat-main{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface)}
.chat-head{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);min-height:58px}
.chat-head h2{margin:0;font-family:var(--serif);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .meta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.chat-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.chat-stream{flex:1;min-height:0;overflow-y:auto;padding:16px clamp(18px,3vw,42px) 26px;background:linear-gradient(var(--surface),var(--surface))}
.day-divider{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:10.5px;letter-spacing:.08em;margin:16px 0}
.day-divider::before,.day-divider::after{content:"";height:1px;flex:1;background:var(--line)}
.msg{display:flex;gap:9px;margin:15px 0;max-width:min(680px,88%);align-items:flex-start}
.msg.self{margin-left:auto;flex-direction:row-reverse}
.msg-body{min-width:0}
.msg-meta{display:flex;align-items:baseline;gap:8px;font-size:10.5px;color:var(--faint);margin:0 2px 4px}
.msg-meta b{font-size:11px;color:var(--muted);font-weight:600}
.msg.self .msg-meta{justify-content:flex-end}
.bubble{background:var(--surface2);border:1px solid var(--line);border-radius:3px 12px 12px 12px;padding:9px 12px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
.msg.self .bubble{background:var(--jade-soft);border-color:color-mix(in srgb,var(--jade) 22%,var(--line));border-radius:12px 3px 12px 12px}
.msg.self .avatar{background:var(--jade);color:#fff;border-color:transparent}
.chat-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:7px 20px;font-size:11px;color:var(--muted)}
.context-rail{border-left:1px solid var(--line);background:var(--surface);padding:14px;overflow-y:auto;min-height:0}
.context-card{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:10px;background:var(--surface)}
.context-card .eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:8px}
.kv{display:grid;grid-template-columns:76px minmax(0,1fr);gap:6px 8px;margin:0;font-size:11.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.mini-timeline{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:11px}
.mini-timeline li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:7px;color:var(--muted)}
.mini-timeline time{color:var(--faint);font-variant-numeric:tabular-nums;font-size:10px}

/* tasks board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
.board-col{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:120px}
.board-col-head{display:flex;align-items:center;gap:7px;padding:2px 3px 9px;font-size:11.5px;font-weight:700;color:var(--muted)}
.board-col-head .count{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}
.task-card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:7px;transition:.12s}
.task-card:hover{border-color:color-mix(in srgb,var(--jade) 45%,var(--line));transform:translateY(-1px);box-shadow:var(--shadow)}
.task-card .row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.task-id{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.task-goal{font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task-meta{display:flex;flex-wrap:wrap;gap:3px 9px;color:var(--faint);font-size:10px;margin-top:7px}
.task-note{margin-top:7px;padding-top:6px;border-top:1px dashed var(--line);font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* outputs */
.outputs-layout{display:grid;grid-template-columns:352px minmax(0,1fr);height:100%;min-height:0}
.tree-rail{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--surface)}
.tree-head{padding:15px 14px 9px;border-bottom:1px solid var(--line)}
.tree-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-weight:700}
.tree-tools{padding:9px 10px 7px;display:flex;gap:6px;flex-wrap:wrap}
.tree-scroll{flex:1;min-height:0;overflow-y:auto;padding:2px 7px 14px}
.tree-dir,.tree-file{display:flex;width:100%;align-items:center;gap:6px;padding:5px 7px;border-radius:7px;text-align:left;font-size:12px;color:var(--ink)}
.tree-dir:hover,.tree-file:hover{background:var(--surface2)}
.tree-file.on{background:var(--jade-soft);color:var(--jade-ink);font-weight:600}
.tree-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-size{font-size:10px;color:var(--faint);flex:none}
.ext{width:30px;flex:none;text-align:center;font-family:var(--mono);font-size:8.5px;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:1px 0;color:var(--muted);background:var(--surface2);text-transform:uppercase}
.chev{width:12px;flex:none;color:var(--faint);transition:transform .12s}
.chev.open{transform:rotate(90deg)}
.preview-pane{min-width:0;overflow-y:auto;padding:18px clamp(16px,3vw,32px) 48px;background:var(--bg)}
.preview-inner{max-width:880px;margin:0 auto}
.preview-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:11px;margin-bottom:14px}
.preview-head h2{font-family:var(--serif);font-size:19px;margin:0;overflow-wrap:anywhere}
.crumbs{display:flex;gap:5px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-bottom:5px}
.preview-actions{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.md-body{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 22px;line-height:1.8;font-size:13.5px}
.md-body h1,.md-body h2,.md-body h3,.md-body h4{font-family:var(--serif);line-height:1.35;margin:1.2em 0 .5em}
.md-body h1{font-size:22px;margin-top:.2em}
.md-body h2{font-size:18px}
.md-body h3{font-size:15.5px}
.md-body p{margin:0 0 .8em}
.md-body ul{margin:0 0 .8em;padding-left:1.4em}
.md-body li{margin:.2em 0}
.md-body code{background:var(--surface2);border-radius:4px;padding:.08em .35em;font-size:.9em}
.md-body pre{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;overflow:auto;font-size:12px}
.md-body table{border-collapse:collapse;width:100%;font-size:12px;margin:0 0 .9em}
.md-body th,.md-body td{border:1px solid var(--line);padding:5px 8px;text-align:left}
.md-body th{background:var(--surface2)}
.raw-pre{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;font-family:var(--mono);font-size:11.5px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.csv-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100dvh - 240px)}

/* approvals / master-detail */
.master-detail{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:14px;align-items:start}
.inbox{display:flex;flex-direction:column;gap:6px;min-width:0}
.inbox-item{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:.12s}
.inbox-item:hover{border-color:var(--line-strong)}
.inbox-item.on{border-color:color-mix(in srgb,var(--jade) 48%,var(--line));background:var(--jade-soft)}
.inbox-main{min-width:0;flex:1}
.inbox-title{font-weight:600;font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.inbox-meta{display:flex;gap:4px 10px;flex-wrap:wrap;color:var(--muted);font-size:10.5px;margin-top:4px}
.detail-pane{position:sticky;top:0;border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:16px;box-shadow:var(--shadow)}
.detail-pane h3{font-family:var(--serif);font-size:18px;margin:0 0 8px}
.timeline{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:0}
.timeline li{position:relative;padding:0 0 12px 17px;font-size:11.5px;color:var(--muted)}
.timeline li::before{content:"";position:absolute;left:2px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--line-strong);box-shadow:0 0 0 3px var(--surface)}
.timeline li::after{content:"";position:absolute;left:5px;top:14px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline b{color:var(--ink);font-weight:600}

/* plans */
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;align-items:start}
.plan-card{padding:15px 16px}
.progress{height:6px;border-radius:6px;background:var(--surface3);overflow:hidden;margin:10px 0 4px}
.progress > i{display:block;height:100%;border-radius:6px;background:var(--jade)}
.goal-list{display:grid;gap:6px;margin:10px 0 0}
.goal{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;cursor:pointer}
.goal input{margin-top:3px;accent-color:var(--jade);width:14px;height:14px;flex:none}
.goal.done span{color:var(--faint);text-decoration:line-through}
.progress-log{display:grid;gap:5px;font-size:11.5px;color:var(--muted);margin-top:8px}
.progress-log .row{display:flex;gap:8px}
.progress-log time{flex:none;color:var(--faint);font-variant-numeric:tabular-nums}
.plan-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* memories */
.mem-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.mem-row{display:block;width:100%;text-align:left;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:7px;transition:.12s}
.mem-row:hover{border-color:var(--line-strong)}
.mem-row.on{border-color:color-mix(in srgb,var(--jade) 48%,var(--line));background:var(--jade-soft)}
.mem-content{font-size:12.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mem-meta{display:flex;flex-wrap:wrap;gap:4px 9px;color:var(--muted);font-size:10.5px;margin-top:5px}
.trace-box{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px}
.trace-msg{padding:8px 10px;border-bottom:1px solid var(--line);font-size:11.5px}
.trace-msg:last-child{border-bottom:0}
.trace-msg.anchor{background:var(--jade-soft)}
.trace-head{display:flex;gap:7px;flex-wrap:wrap;color:var(--faint);font-size:10px;margin-bottom:3px}

/* business */
.biz-layout{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;height:100%;min-height:0}
.biz-rail{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--surface)}
.biz-cats{display:flex;flex-wrap:wrap;gap:4px;padding:12px 12px 8px}
.biz-cat{padding:3px 8px;border-radius:999px;font-size:11px;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.biz-cat.on{background:var(--jade-soft);border-color:color-mix(in srgb,var(--jade) 40%,var(--line));color:var(--jade-ink);font-weight:700}
.biz-search{padding:0 12px 8px}
.biz-list{flex:1;min-height:0;overflow-y:auto;padding:0 8px 14px}
.biz-item{display:block;width:100%;text-align:left;padding:7px 8px;border-radius:8px;margin-bottom:2px}
.biz-item:hover{background:var(--surface2)}
.biz-item.on{background:var(--jade-soft)}
.biz-item .t{font-size:12px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.biz-item .s{font-size:10px;color:var(--faint);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.graph-pane{position:relative;background:var(--bg);min-width:0;overflow:hidden}
.graph-svg{width:100%;height:100%;display:block}
.graph-legend{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:9.5px;color:var(--muted)}
.graph-legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:3px}
.node{cursor:pointer}
.node rect{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2;rx:9}
.node text{fill:var(--ink);font-size:10px;font-family:inherit;pointer-events:none}
.node .nsub{fill:var(--faint);font-size:8px;font-family:var(--mono)}
.node.on rect{stroke:var(--jade);stroke-width:2.2;fill:var(--jade-soft)}
.node:hover rect{stroke:var(--jade)}
.biz-detail{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;min-height:0;padding:14px}
.biz-detail h3{font-family:var(--serif);font-size:17px;margin:0 0 2px;overflow-wrap:anywhere}
.edge-row{display:flex;gap:6px;align-items:baseline;padding:5px 0;border-top:1px dashed var(--line);font-size:11.5px;flex-wrap:wrap}
.edge-row:first-child{border-top:0}
.edge-row .dir{color:var(--faint);flex:none}
.link-btn{color:var(--jade);text-align:left;overflow-wrap:anywhere}
.link-btn:hover{text-decoration:underline}

/* manage */
.manage-layout{display:grid;grid-template-columns:190px minmax(0,1fr);height:100%;min-height:0}
.manage-nav{border-right:1px solid var(--line);background:var(--surface);padding:12px 9px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.manage-nav button{text-align:left;padding:7px 10px;border-radius:8px;color:var(--muted);font-size:12.5px}
.manage-nav button:hover{background:var(--surface2);color:var(--ink)}
.manage-nav button.on{background:var(--jade-soft);color:var(--jade-ink);font-weight:700}
.manage-body{min-height:0;overflow-y:auto;padding:20px clamp(14px,3vw,34px) 54px}
.manage-body .page-head{margin-top:0}
.chart{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;margin-bottom:14px;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:540px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.split-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.session-list{border:1px solid var(--line);border-radius:11px;background:var(--surface);overflow:hidden}
.session-row{display:block;width:100%;text-align:left;padding:9px 11px;border-bottom:1px solid var(--line)}
.session-row:last-child{border-bottom:0}
.session-row:hover{background:var(--surface2)}
.session-row.on{background:var(--jade-soft)}
.session-row b{font-size:12px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-row span{font-size:10px;color:var(--faint);display:block;margin-top:2px}
.msg-log{display:grid;gap:8px}
.log-msg{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface);font-size:11.5px;line-height:1.65}
.log-msg .h{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:4px;color:var(--faint);font-size:10px}
.log-msg .body{white-space:pre-wrap;overflow-wrap:anywhere}
.editor-grid{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;align-items:start}
.prompt-list{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.prompt-row{display:block;width:100%;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);font-size:11.5px}
.prompt-row:last-child{border-bottom:0}
.prompt-row:hover{background:var(--surface2)}
.prompt-row.on{background:var(--jade-soft);color:var(--jade-ink);font-weight:700}
.editor-wrap{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.editor-bar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--surface2);font-size:11px;color:var(--muted)}
.editor-body{display:grid;grid-template-columns:44px minmax(0,1fr);min-height:330px;font-family:var(--mono);font-size:11.5px;line-height:1.7}
.gutter{padding:10px 6px;text-align:right;color:var(--faint);background:var(--surface2);border-right:1px solid var(--line);user-select:none;overflow:hidden;white-space:pre}
.editor-textarea{border:0;border-radius:0;background:var(--surface);resize:none;min-height:330px;padding:10px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.7;outline:none;width:100%}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.setting-box{border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:13px}
.setting-box h4{margin:0 0 2px;font-size:12.5px}
.setting-box p{margin:0 0 9px;color:var(--muted);font-size:10.5px;line-height:1.55}
.inline-fields{display:flex;gap:8px;flex-wrap:wrap}
.inline-fields .field{width:110px}
.dirty{font-size:10.5px;color:var(--amber);display:inline-flex;align-items:center;gap:4px}
.dirty::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber)}

/* prd / anchors / panel */
.pin{display:none;position:absolute;top:8px;left:8px;z-index:20;width:22px;height:22px;border-radius:50%;background:#7c3aed;color:#fff;font:700 11px/22px var(--mono);text-align:center;cursor:pointer;box-shadow:0 2px 7px rgba(124,58,237,.4);cursor:pointer}
body.prd .pin{display:block}
body.prd [data-prd]{outline:1.5px dashed rgba(124,58,237,.42);outline-offset:3px}
body.prd [data-prd].hl{outline:2.5px solid #7c3aed;outline-offset:3px}
body.prd .page{position:relative}
.prd-panel{display:none;position:fixed;top:0;right:0;bottom:0;width:420px;z-index:80;background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;padding:18px 18px 60px;box-shadow:-12px 0 30px -24px rgba(0,0,0,.45)}
body.prd .prd-panel{display:block}
body.prd .app-footer{margin-right:0}
body.prd .chat-layout{grid-template-columns:250px minmax(0,1fr)}
body.prd .context-rail{display:none}
body.prd .biz-layout{grid-template-columns:220px minmax(0,1fr)}
body.prd .biz-detail{display:none}
.gone-note{display:none;align-items:center;gap:8px;margin-top:16px;padding:8px 10px;border:1px dashed var(--line-strong);border-radius:8px;font-size:11px;color:var(--muted)}
body.prd .gone-note{display:flex}
.gone-item{text-decoration:line-through;color:var(--faint)}
.gone-tag{font-size:9px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--rose)}
.prd-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.prd-top h2{margin:0;font-family:var(--serif);font-size:19px}
.prd-legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.prd-hint{font-size:10.5px;color:var(--muted);line-height:1.65;margin-bottom:14px;padding:8px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
.prd-panel .note{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:12px;background:var(--surface);cursor:pointer;transition:border-color .12s}
.prd-panel .note:hover{border-color:rgba(124,58,237,.5)}
.prd-panel .note.hl{border:2px solid #7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.prd-panel .note-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.prd-panel .note-no{width:20px;height:20px;border-radius:50%;background:#7c3aed;color:#fff;display:grid;place-items:center;font:700 10px var(--mono);flex:none}
.prd-panel .note-head h3{margin:0;font-size:13.5px;font-family:var(--serif)}
.prd-panel .note-head .id{margin-left:auto;font:10px var(--mono);color:var(--faint)}
.prd-panel .note-sec{margin-top:8px}
.prd-panel .note-sec > b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.prd-panel .note-sec p,.prd-panel .prd-panel .note-sec ul{margin:0;font-size:11.5px;line-height:1.65;color:var(--muted)}
.note-sec ul{padding-left:1.25em}
.prd-panel .note-sec li{margin:1px 0}
.src{display:inline-flex;align-items:center;gap:5px;margin:2px 3px 2px 0;font-size:10.5px;line-height:1.5;border-radius:5px;padding:1px 6px;border:1px solid var(--line)}
.src::before{content:"";width:6px;height:6px;border-radius:50%;flex:none}
.src.has{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 28%,var(--line));color:var(--ok)}
.src.has::before{background:var(--ok)}
.src.new{background:var(--rose-soft);border-color:color-mix(in srgb,var(--rose) 28%,var(--line));color:var(--rose)}
.src.new::before{background:var(--rose)}
.src.ask{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 30%,var(--line));color:var(--amber)}
.src.ask::before{background:var(--amber)}

/* drawer, modal, toast */
.overlay{position:fixed;inset:0;background:rgba(18,24,20,.34);z-index:90;display:flex;justify-content:flex-end;animation:fade .14s ease}
.drawer{width:min(520px,100vw);height:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:-18px 0 50px -30px rgba(0,0,0,.6);display:flex;flex-direction:column;animation:slide .18s ease}
.drawer-head{flex:none;display:flex;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer-head h2{font-family:var(--serif);font-size:19px;margin:0;line-height:1.25;overflow-wrap:anywhere}
.drawer-head .sub{color:var(--muted);font-size:11.5px;margin-top:3px}
.drawer-body{flex:1;min-height:0;overflow-y:auto;padding:16px 18px 40px}
.drawer-foot{flex:none;border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:8px;justify-content:flex-end;background:var(--surface)}
.modal-wrap{position:fixed;inset:0;background:rgba(18,24,20,.4);z-index:100;display:grid;place-items:center;padding:18px;animation:fade .14s ease}
.modal{width:min(520px,100%);background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);padding:18px}
.modal h2{font-family:var(--serif);font-size:19px;margin:0 0 6px}
.modal p{color:var(--muted);font-size:12.5px;line-height:1.7;margin:0 0 12px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:120;background:#1d2722;color:#f5f7f3;padding:8px 16px;border-radius:999px;font-size:12px;box-shadow:0 8px 26px rgba(0,0,0,.35);animation:fade .15s ease;max-width:80vw}
.toast.error{background:var(--rose)}
.toast.ok{background:#1f6b4d}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:translateX(0);opacity:1}}

@media (max-width:1200px){
  .chat-layout{grid-template-columns:260px minmax(0,1fr)}
  .context-rail{display:none}
  .biz-layout{grid-template-columns:230px minmax(0,1fr)}
  .biz-detail{display:none}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .master-detail,.mem-layout{grid-template-columns:1fr}
  .detail-pane{position:static}
}
@media (max-width:820px){
  .origin,.sep{display:none}
  .brand-name{font-size:15px}
  .chat-layout,.outputs-layout,.manage-layout{grid-template-columns:1fr}
  .pool-rail,.tree-rail,.manage-nav{display:none}
  .biz-layout{grid-template-columns:1fr}
  .biz-rail{display:none}
  .split,.split-3{grid-template-columns:1fr}
  body.prd .app{margin-right:0}
  .prd-panel{width:100vw}
}
</style>

<body>
<div class="app" id="app">
  <header class="app-header" data-prd="shell">
    <i class="pin" data-pin="shell">1</i>
    <div class="brand">
      <span class="brand-mark">兔</span>
      <span class="brand-name">Rabbit Bot 管理台</span>
      <span class="chip jade">本地管理</span>
    </div>
    <div class="header-tools">
      <span class="health"><i class="dot"></i>API 正常</span>
      <span class="sep">·</span>
      <span class="origin">http://127.0.0.1:3738</span>
      <button class="btn ghost sm" data-act="logout">退出</button>
      <div class="mode-switch" role="group" aria-label="评审视图">
        <button data-mode="proto" class="on">原型</button>
        <button data-mode="prd">PRD</button>
      </div>
    </div>
  </header>
  <nav class="main-tabs" aria-label="功能页签" id="tabs"></nav>
  <main class="app-main"><div id="view"></div></main>
  <footer class="app-footer" id="hint"></footer>
</div>
<aside class="prd-panel" id="prd-panel" aria-label="PRD 说明"></aside>
<div id="overlay-root"></div>
<div id="toast-root"></div>
<script>
/* ============================================================
   状态与工具
   ============================================================ */
const S = {
  mode:'proto', tab:'chat',
  chat:{scope:'active', q:'', pool:'shop', policy:'direct', primary:false},
  tasks:{q:'', status:'all', executor:'all', view:'board', overrides:{}},
  outputs:{q:'', type:'all', open:{'task-104':true}, file:'task-104/自检清单.md'},
  approvals:{status:'all', sel:2},
  plans:{status:'active', drafts:{}, showNew:false, newTitle:'', newBackground:'', newGoals:'', busy:false},
  memories:{user:'', kind:'all', scope:'all', valid:'all', q:'', sel:42, editing:false, draft:'', trace:null, page:1},
  business:{cat:'objects', q:'', sel:{kind:'objects', id:'obj:shop'}},
  manage:{view:'usage', range:'7d', session:'s1', prompt:'system', personaDraft:'', personaDirty:false,
    settings:{privateSec:'90', groupSec:'45', taskSec:'15', memoryEvery:'10', memoryMin:'300', wdDelay:'10', wdCool:'600', sendEnabled:true, defaultReview:false},
    settingsDirty:false, alias:{u1:'贺伟康', u2:'林晓', u3:'小王'}, scheduleNew:false,
    schedule:{title:'', content:'', kind:'cron', cron:'0 9 * * *', delay:'10'}, scheduleFilter:'all'},
  drawer:null, modal:null, toast:null,
  rejectReason:''

function taskStatus(id){ const t = TASKS.find(x => x.id === id); return (S.tasks.overrides[id]) || (t ? t.status : 'pending'); }
function viewTasks(){
  const f = S.tasks;
  const q = f.q.trim().toLowerCase();
  const rows = TASKS.filter(t => {
    const status = taskStatus(t.id);
    if(f.status !== 'all' && status !== f.status) return false;
    if(f.executor !== 'all' && t.executor !== f.executor) return false;
    if(q){ const hay = [t.id,t.name,t.goal,t.deliverable,t.constraints,t.acceptance,t.result,t.note,t.worker,t.executor].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  }).sort((a,b) => b.id - a.id);
  const counts = {pending:0,running:0,done:0,blocked:0};
  TASKS.forEach(t => { const s = taskStatus(t.id); if(s === 'pending_approval' || s === 'pending') counts.pending++; if(s === 'running') counts.running++; if(s === 'done') counts.done++; if(s === 'blocked') counts.blocked++; });
  const groups = [
    {key:'pending', title:'待审批', statuses:['pending_approval','pending'], color:'warn'},
    {key:'running', title:'进行中', statuses:['running'], color:'info'},
    {key:'blocked', title:'阻塞', statuses:['blocked','failed'], color:'bad'},
    {key:'done', title:'已结束', statuses:['done','cancelled'], color:'muted'}

    return '<div class="board-col"><div class="board-col-head"><span class="badge ' + g.color + '">' + g.title + '</span><span class="count">' + list.length + '</span></div>' +
      (list.length ? list.map(taskCard).join('') : '<div class="empty" style="padding:14px 4px;font-size:11px">没有任务</div>') + '</div>';
  }).join('');
  const list = rows.map(t => '<tr><td class="mono">#' + t.id + '</td><td>' + badge(taskStatus(t.id)) + '</td><td style="max-width:420px">' + esc(t.goal) + '</td><td>' + esc(t.executor) + '</td><td class="mono tiny">' + esc(t.worker || '—') + '</td><td class="num">' + esc(t.updated) + '</td><td><button class="btn ghost sm" data-act="task-open" data-value="' + t.id + '">详情</button></td></tr>').join('');

    '<div class="page-head"><div><div class="eyebrow">Task Pool</div><h1>任务</h1><p class="sub">按状态扫任务，审批与预览不离开列表。审批通过后执行器会以无审批模式启动。</p></div>' +
      '<div class="head-actions"><span class="chip">' + rows.length + ' 条结果</span></div></div>' +
    '<div class="kpis">' +
      '<div class="kpi amber"><div class="label">待审批</div><div class="value">' + counts.pending + '</div><div class="note">飞书审批为主</div></div>' +
      '<div class="kpi jade"><div class="label">进行中</div><div class="value">' + counts.running + '</div><div class="note">含 running / working</div></div>' +
      '<div class="kpi rose"><div class="label">阻塞</div><div class="value">' + counts.blocked + '</div><div class="note">需要人介入</div></div>' +
      '<div class="kpi"><div class="label">已完成</div><div class="value">' + counts.done + '</div><div class="note">含 cancelled</div></div>' +
    '</div>' +
    '<div class="filterbar">' +
      field('视图', seg('tasks.view', f.view, [{v:'board',t:'看板'},{v:'list',t:'列表'}], '视图'), '') +
      field('状态', select('tasks.status', f.status, [{v:'all',t:'全部'},{v:'pending_approval',t:'pending_approval'},{v:'running',t:'running'},{v:'blocked',t:'blocked'},{v:'done',t:'done'},{v:'failed',t:'failed'},{v:'cancelled',t:'cancelled'}], '任务状态')) +
      field('执行器', select('tasks.executor', f.executor, [{v:'all',t:'全部'},{v:'opencode',t:'opencode'},{v:'mimo',t:'mimo'}], '执行器')) +
      field('搜索', input('tasks.q', f.q, {ph:'id / 任务名 / 目标 / worker / note', focus:'tasks-q'}), 'grow') +
    '</div>' +
    (f.view === 'board' ? '<div class="board">' + board + '</div>' :
      '<div class="table-wrap"><table class="table"><thead><tr><th>id</th><th>status</th><th>goal</th><th>executor</th><th>worker</th><th>updated</th><th></th></tr></thead><tbody>' + (list || '<tr><td colspan="7"><div class="empty">没有匹配的任务。</div></td></tr>') + '</tbody></table></div>') +

function allFiles(nodes, out){ out = out || []; nodes.forEach(n => { if(n.kind === 'file') out.push(n); else allFiles(n.children || [], out); }); return out; }
function countFiles(nodes){ return allFiles(nodes).length; }
function fileByPath(path){ return allFiles(OUTPUT_TREE).find(f => f.path === path); }
function treeVisible(nodes, q, type, open){
  return nodes.map(n => {
    if(n.kind === 'file'){
      const hitQ = !q || n.name.toLowerCase().includes(q);
      const hitT = type === 'all' || n.ext === type;
      return hitQ && hitT ? n : null;
    }
    const kids = treeVisible(n.children || [], q, type, open);
    return kids.length ? Object.assign({}, n, {children:kids}) : null;
  }).filter(Boolean);
}
function viewOutputs(){
  const f = S.outputs;
  const q = f.q.trim().toLowerCase();
  const visible = treeVisible(OUTPUT_TREE, q, f.type, f.open);
  const files = countFiles(OUTPUT_TREE);
  const file = fileByPath(f.file) || allFiles(OUTPUT_TREE)[0];
  const openSet = f.open;
  function nodeRows(nodes, depth){
    return nodes.map(n => {
      if(n.kind === 'dir'){
        const isOpen = (q || S.outputs.type !== 'all') ? true : !!openSet[n.path];
        const kids = isOpen ? nodeRows(n.children || [], depth + 1) : '';
        return '<li><button class="tree-dir" data-act="outputs-dir" data-value="' + esc(n.path) + '" style="padding-left:' + (6 + depth * 13) + 'px"><svg class="chev ' + (isOpen ? 'open' : '') + '" viewBox="0 0 16 16" fill="none"><path d="m6 4 4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="ext" style="background:var(--jade-soft);color:var(--jade-ink);border-color:transparent">DIR</span><span class="tree-name">' + esc(n.name) + '</span><span class="tree-size">' + countFiles(n.children || []) + '</span></button>' + (kids ? '<ul style="list-style:none;margin:0;padding:0">' + kids + '</ul>' : '') + '</li>';
      }
      return '<li><button class="tree-file ' + (file && file.path === n.path ? 'on' : '') + '" data-act="outputs-file" data-value="' + esc(n.path) + '" style="padding-left:' + (8 + depth * 13) + 'px"><span style="width:12px;flex:none"></span><span class="ext">' + esc((n.ext || 'file').slice(0,4)) + '</span><span class="tree-name">' + esc(n.name) + '</span><span class="tree-size">' + (n.bytes/1024).toFixed(1) + 'K</span></button></li>';
    }).join('');
  }
  return '<div class="page flush" data-prd="outputs">' + pin('outputs') +
    '<div class="outputs-layout"><aside class="tree-rail">' +
      '<div class="tree-head"><div class="tree-title"><span>产出目录</span><span class="tiny muted">' + files + ' 个文件</span></div></div>' +
      '<div class="tree-tools">' + input('outputs.q', f.q, {ph:'搜索文件名…', focus:'outputs-q', cls:'input'}) + '</div>' +
      '<div class="tree-tools" style="padding-top:0">' + seg('outputs.type', f.type, [{v:'all',t:'全部'},{v:'md',t:'md'},{v:'csv',t:'csv'},{v:'html',t:'html'}], '文件类型') + '</div>' +
      '<div class="tree-scroll"><ul style="list-style:none;margin:0;padding:0">' + (visible.length ? nodeRows(visible, 0) : '<li><div class="empty">没有匹配的文件。</div></li>') + '</ul></div>' +
    '</aside><section class="preview-pane"><div class="preview-inner">' +
      '<div class="preview-head"><div style="min-width:0"><div class="crumbs">' + esc(file.path).split('/').map((x,i) => '<span>' + esc(x) + '</span>' + (i < file.path.split('/').length - 1 ? '<span>/</span>' : '')).join('') + '</div><h2>' + esc(file.name) + '</h2>' +
        '<div class="card-meta"><span>' + (file.bytes/1024).toFixed(1) + ' KB</span><span>' + esc(file.mtime) + '</span><span class="tag">' + esc(file.ext) + '</span></div></div>' +
        '<div class="preview-actions"><button class="btn ghost sm" data-act="outputs-copy">复制路径</button><button class="btn ghost sm" data-act="outputs-reload">重新加载</button></div></div>' +
      '<div>' + filePreview(file) + '</div>' +
    '</div></section></div></div>';
}
function filePreview(f){
  if(f.binary) return '<div class="empty">二进制文件，暂不支持预览。</div>';
  if(f.ext === 'md' || f.ext === 'markdown') return '<div class="md-body">' + miniMd(f.content) + '</div>';
  if(f.ext === 'csv' || f.ext === 'tsv') return csvPreview(f.content);
  return '<pre class="raw-pre">' + esc(f.content) + '</pre>';
}
function miniMd(text){
  const inline = s => esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
  let html = '', list = [];
  const flush = () => { if(list.length){ html += '<ul>' + list.join('') + '</ul>'; list = []; } };
  String(text).split('\n').forEach(line => {
    const li = line.match(/^\s*[-*]\s+(.*)$/);
    if(li){ list.push('<li>' + inline(li[1]) + '</li>'); return; }
    flush();
    if(!line.trim()) return;
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if(h){ html += '<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'; return; }
    html += '<p>' + inline(line) + '</p>';
  });
  flush();
  return html;
}
function csvPreview(text){
  const rows = String(text).trim().split('\n').slice(0, 80).map(l => l.split(',').map(c => c.replace(/^"|"$/g,'')));
  const head = rows.shift() || [];
  return '<div class="csv-box"><table class="table"><thead><tr>' + head.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
}

function graphSvg(){
  const W = 800, H = 480;

  let edges = BUSINESS.edges.map(e => {
    const a = BUSINESS.pos[e.from], c = BUSINESS.pos[e.to];
    if(!a || !c) return '';
    return '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + c[0] + '" y2="' + c[1] + '" stroke="var(--line-strong)" stroke-width="1.4" stroke-dasharray="4 4"/>';
  }).join('');
  let nodes = BUSINESS.objects.map(o => {
    const p = BUSINESS.pos[o.id]; if(!p) return '';
    const on = S.business.sel.kind === 'objects' && S.business.sel.id === o.id;
    const w = 132, h = 44, x = p[0] - w/2, y = p[1] - h/2;
    return '<g class="node ' + (on ? 'on' : '') + '" data-act="biz-sel" data-value="objects|' + o.id + '">' +
      '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="9" style="stroke:' + colors[o.type] + '"/>' +
      '<text x="' + p[0] + '" y="' + (p[1] - 2) + '" text-anchor="middle" style="font-weight:700">' + esc(o.name) + '</text>' +
      '<text class="nsub" x="' + p[0] + '" y="' + (p[1] + 13) + '" text-anchor="middle">' + esc(o.id.replace('obj:','')) + '</text></g>';
  }).join('');
  return '<svg class="graph-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="业务关系图">' + edges + nodes + '</svg>';
}

const VIEWS = {chat:viewChat, tasks:viewTasks, outputs:viewOutputs, approvals:viewApprovals, plans:viewPlans, memories:viewMemories, business:viewBusiness, manage:viewManage};
function render(){
  document.body.classList.toggle('prd', S.mode === 'prd');
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === S.mode));
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = TABS.map(t => '<button class="tab ' + (S.tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '" aria-current="' + (S.tab === t[0] ? 'page' : 'false') + '">' + t[1] + '</button>').join('') +
    '<button class="refresh-pill" data-act="refresh"><svg viewBox="0 0 24 24" fill="none"><path d="M20.5 7.5V12h-4.5M3.5 16.5V12H8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.6 9.5A7.2 7.2 0 0 1 18.2 7M18.4 14.5A7.2 7.2 0 0 1 5.8 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>刷新</button>';
  document.getElementById('view').innerHTML = VIEWS[S.tab]();
  document.getElementById('hint').textContent = HINTS[S.tab] || '';
  renderPrd();
  renderOverlay();
  assignPins();
}
function prdNotes(){
  const ids = ['shell', S.tab];
  return ids.map((id,i) => ({id, no:i+1, data:PRD[id]})).filter(x => x.data);
}
function renderPrd(){
  const panel = document.getElementById('prd-panel');
  if(S.mode !== 'prd'){ panel.innerHTML = ''; return; }
  const notes = prdNotes();
  panel.innerHTML = '<div class="prd-top"><h2>PRD · 当前页</h2><span class="tiny faint">' + esc(S.tab) + '</span></div>' +
    '<div class="prd-legend"><span class="src has">已有</span><span class="src new">新做</span><span class="src ask">待确认</span></div>' +
    '<div class="prd-hint">点原型里的紫色编号 → 跳到对应说明；点说明卡 → 高亮并滚回原型模块。当前显示「外壳 + 本页」两条，编号与原型锚点一一对应。</div>' +
    notes.map(n => '<div class="note" data-note="' + n.id + '"><div class="note-head"><span class="note-no" data-pin="' + n.id + '">' + n.no + '</span><h3>' + esc(n.data.title) + '</h3><span class="id">' + n.id + '</span></div>' +
      noteSec('用途', '<p>' + esc(n.data.use) + '</p>') +
      noteSec('字段与口径', '<ul>' + n.data.fields.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>') +
      noteSec('数据来源', n.data.src.map(s => '<span class="src ' + s[0] + '">' + (s[0] === 'has' ? '已有' : s[0] === 'new' ? '新做' : '待确认') + ' · ' + esc(s[1]) + '</span>').join('')) +
      noteSec('规则与出处', '<ul>' + n.data.rule.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>') +
      noteSec('交互', '<ul>' + n.data.act.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>') +
      noteSec('待确认', '<ul>' + n.data.open.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>') +
    '</div>').join('');
}
function noteSec(title, inner){ return '<div class="note-sec"><b>' + title + '</b>' + inner + '</div>'; }
function assignPins(){
  const notes = prdNotes();
  notes.forEach(n => {
    document.querySelectorAll('[data-pin="' + n.id + '"]').forEach(el => { if(el.textContent !== String(n.no)) el.textContent = n.no; });
  });
}
function focusNote(id, fromNote){
  document.querySelectorAll('.hl').forEach(el => el.classList.remove('hl'));
  const target = document.querySelector('[data-prd="' + id + '"]');
  const note = document.querySelector('[data-note="' + id + '"]');
  if(target) target.classList.add('hl');
  if(note) note.classList.add('hl');
  if(fromNote){ if(target) target.scrollIntoView({behavior:'smooth', block:'start'}); }
  else { if(note) note.scrollIntoView({behavior:'smooth', block:'center'}); }
}

function renderOverlay(){
  const root = document.getElementById('overlay-root');
  let html = '';
  if(S.modal) html += renderModal();
  if(S.drawer) html += renderDrawer();
  root.innerHTML = html;
  const tr = document.getElementById('toast-root');
  tr.innerHTML = S.toast ? '<div class="toast ' + (S.toast.kind || '') + '">' + esc(S.toast.text) + '</div>' : '';
}
function renderDrawer(){
  const d = S.drawer;
  if(d.kind === 'task') return taskDrawer(d.id);
  if(d.kind === 'plan-new') return planDrawer();
  return '';
}
function taskDrawer(id){
  const t = TASKS.find(x => x.id === id);
  if(!t) return '';
  const st = taskStatus(id);
  const tab = S.drawer.tab || 'detail';
  return '<div class="overlay"><aside class="drawer">' +
    '<div class="drawer-head"><div style="min-width:0"><h2>#' + t.id + ' ' + esc(t.name) + '</h2><div class="sub">executor ' + esc(t.executor) + ' · worker ' + esc(t.worker || '未领取') + ' · 更新 ' + esc(t.updated) + '</div></div><button class="icon-btn" data-act="close-drawer" aria-label="关闭">✕</button></div>' +
    '<div class="drawer-body">' +
      '<div style="display:flex;gap:7px;flex-wrap:wrap">' + badge(st) + (t.stage ? '<span class="tag">' + esc(t.stage) + '</span>' : '') + '<span class="tag">' + esc(t.model) + '</span></div>' +
      '<div class="segmented" style="margin-top:12px"><button class="' + (tab === 'detail' ? 'on' : '') + '" data-act="task-tab" data-value="detail">详情</button><button class="' + (tab === 'event' ? 'on' : '') + '" data-act="task-tab" data-value="event">事件 · ' + t.events.length + '</button></div>' +
      (tab === 'detail' ? taskDetailHtml(t) : taskEventsHtml(t)) +
    '</div>' +
    '<div class="drawer-foot">' + (st === 'pending_approval' ? '<button class="btn ghost sm" data-act="task-reject">驳回</button><button class="btn primary sm" data-act="task-approve">通过并执行</button>' : '<button class="btn ghost sm" data-act="close-drawer">关闭</button>') + '</div>' +  '</aside></div>';
}
function taskDetailHtml(t){
  const rows = [['goal',t.goal],['deliverable',t.deliverable],['constraints',t.constraints],['acceptance',t.acceptance],['result',t.result],['artifact',t.artifact],['work_dir',t.work_dir],['session_id',t.session],['doc_path',t.doc],['note',t.note]];
  return '<dl class="kv" style="grid-template-columns:92px minmax(0,1fr);gap:8px 10px;margin-top:12px">' + rows.filter(r => r[1]).map(r => '<dt>' + r[0] + '</dt><dd' + (['artifact','work_dir','session_id','doc_path'].includes(r[0]) ? ' class="mono tiny"' : '') + '>' + esc(r[1]) + '</dd>').join('') + '</dl>' +
    (taskStatus(t.id) === 'pending_approval' ? '<div class="notice" style="margin-top:12px">通过后会立即以无审批模式启动 ' + esc(t.executor) + '，可能执行任意命令；请先在飞书确认。</div><div style="margin-top:10px">' + field('驳回原因（必填）', '<textarea class="textarea" rows="2" data-edit="rejectReason" data-focus="reject-reason" placeholder="写清楚为什么不通过">' + esc(S.rejectReason) + '</textarea>') + '</div>' : '');
}
function taskEventsHtml(t){
  return '<ol class="timeline" style="margin-top:12px">' + t.events.map(e => '<li><b>' + esc(e.time) + ' · ' + esc(e.sender) + '</b><br><span style="white-space:pre-wrap">' + esc(e.text) + '</span></li>').join('') + '</ol>';
}
function planDrawer(){
  const p = S.plans;
  return '<div class="overlay"><aside class="drawer"><div class="drawer-head"><div><h2>新建计划</h2><div class="sub">标题必填；目标一行一条。</div></div><button class="icon-btn" data-act="plan-close" aria-label="关闭">✕</button></div>' +
    '<div class="drawer-body">' + field('标题', input('plans.newTitle', p.newTitle, {ph:'一句话说清要做什么', focus:'plan-new-title'})) + '<div style="height:10px"></div>' + field('背景', '<textarea class="textarea" rows="4" data-edit="plans.newBackground" data-focus="plan-new-bg" placeholder="为什么做、范围、约束、相关链接">' + esc(p.newBackground) + '</textarea>') + '<div style="height:10px"></div>' + field('目标（一行一条）', '<textarea class="textarea" rows="4" data-edit="plans.newGoals" data-focus="plan-new-goals" placeholder="查 state\n回报结果">' + esc(p.newGoals) + '</textarea>') + '</div>' +
    '<div class="drawer-foot"><button class="btn ghost sm" data-act="plan-close">取消</button><button class="btn primary sm" data-act="plan-create">保存计划</button></div></aside></div>';
}
function renderModal(){
  const m = S.modal;
  if(m.kind === 'approve'){
    const t = TASKS.find(x => x.id === m.id);
    return '<div class="modal-wrap"><div class="modal"><h2>通过并执行 #' + m.id + '？</h2><p>通过后会立即以无审批模式启动 ' + esc(t ? t.executor : '执行器') + '（可能带 --dangerously-skip-permissions），可能执行任意命令。原型里只演示状态变化。</p><div class="modal-actions"><button class="btn ghost sm" data-act="modal-close">取消</button><button class="btn primary sm" data-act="modal-confirm-approve" data-value="' + m.id + '">确认通过</button></div></div></div>';
  }
  if(m.kind === 'delete-memory'){
    const mem = MEMORIES.find(x => x.id === m.id);
    return '<div class="modal-wrap"><div class="modal"><h2>删除记忆 #' + m.id + '？</h2><p>' + esc(mem ? mem.content : '') + '<br><br>删除后不可撤销；如果只是过期，应该走 IM 标记失效。</p><div class="modal-actions"><button class="btn ghost sm" data-act="modal-close">取消</button><button class="btn danger sm" data-act="modal-confirm-delete" data-value="' + m.id + '">确认删除</button></div></div></div>';
  }
  return '';
}

/* ============================================================
   事件委托
   ============================================================ */
function toast(text, kind){ S.toast = {text, kind: kind || 'ok'}; render(); clearTimeout(toast._t); toast._t = setTimeout(() => { S.toast = null; render(); }, 2200); }
function rerenderPreservingFocus(input){
  const key = input && input.dataset ? input.dataset.focus : null;
  const start = input && input.selectionStart;
  const end = input && input.selectionEnd;
  const scroll = input ? input.scrollTop : 0;
  render();
  if(key){
    const next = document.querySelector('[data-focus="' + key + '"]');
    if(next){ next.focus(); try{ next.setSelectionRange(start, end); }catch(e){} next.scrollTop = scroll; }
  }
}
function markDirty(path){
  if(path.indexOf('manage.settings') === 0) S.manage.settingsDirty = true;
  if(path === 'manage.personaDraft') S.manage.personaDirty = true;
}
function syncDirtyUI(){
  const head = document.querySelector('.manage-body .page-head .head-actions');
  const dirty = S.manage.view === 'persona' ? S.manage.personaDirty : S.manage.view === 'settings' ? S.manage.settingsDirty : (S.manage.personaDirty || S.manage.settingsDirty);
  if(head){
    const first = head.firstElementChild;
    if(first && (first.classList.contains('dirty') || (first.classList.contains('chip') && (S.manage.view === 'persona' || S.manage.view === 'settings')))){
      first.className = dirty ? 'dirty' : 'chip';
      first.textContent = dirty ? '有未保存改动' : '已同步';
    }
  }
  const save = head ? head.querySelector('[data-act="persona-save"], [data-act="settings-save"]') : null;
  if(save) save.disabled = !dirty;
}
const QUIET_INPUT = /^(rejectReason|memories\.draft|plans\.(drafts\.|newTitle|newBackground|newGoals)|manage\.personaDraft|manage\.schedule\.(title|content|cron|delay)|manage\.alias\.|manage\.settings\.)/;
const FILTER_INPUT = /^(chat\.q|tasks\.q|outputs\.q|memories\.(user|q)|business\.q)$/;
let filterTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if(!t.dataset || !t.dataset.edit || t.tagName === 'SELECT') return;
  const path = t.dataset.edit;
  const val = t.type === 'checkbox' ? t.checked : t.value;
  setPath(S, path, val);
  markDirty(path);
  if(QUIET_INPUT.test(path)){ syncDirtyUI(); return; }
  if(FILTER_INPUT.test(path)){
    clearTimeout(filterTimer);
    filterTimer = setTimeout(() => {
      const el = document.activeElement;
      const key = el && el.dataset ? el.dataset.focus : null;
      const start = el ? el.selectionStart : 0;
      const end = el ? el.selectionEnd : 0;
      render();
      if(key){ const next = document.querySelector('[data-focus="' + key + '"]'); if(next){ next.focus(); try{ next.setSelectionRange(start, end); }catch(err){} } }
    }, 140);
    return;
  }
  rerenderPreservingFocus(t);
});
document.addEventListener('change', e => {
  const t = e.target;
  if(!t.dataset || !t.dataset.edit) return;
  if(t.tagName !== 'SELECT' && t.type !== 'checkbox') return;
  const path = t.dataset.edit;
  setPath(S, path, t.tagName === 'SELECT' ? t.value : t.checked);
  markDirty(path);
  render();
});
document.addEventListener('click', e => {
  const target = e.target;
  if(target.classList && (target.classList.contains('overlay') || target.classList.contains('modal-wrap'))){ S.drawer = null; S.modal = null; render(); return; }
  const mode = e.target.closest('[data-mode]');
  if(mode){ S.mode = mode.dataset.mode; render(); return; }
  const tab = e.target.closest('[data-tab]');
  if(tab){ S.tab = tab.dataset.tab; S.drawer = null; render(); return; }
  const pinEl = e.target.closest('[data-pin]');
  if(pinEl && pinEl.tagName.toLowerCase() === 'i'){ focusNote(pinEl.dataset.pin, false); return; }
  const note = e.target.closest('[data-note]');
  if(note){ focusNote(note.dataset.note, true); return; }
  const setEl = e.target.closest('[data-set]');
  if(setEl){ setPath(S, setEl.dataset.set, setEl.dataset.value); render(); return; }
  const actEl = e.target.closest('[data-act]');
  if(actEl){ doAction(actEl.dataset.act, actEl); return; }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && (S.drawer || S.modal)){ S.drawer = null; S.modal = null; render(); }
});

function doAction(act, el){
  const v = el.dataset.value;
  switch(act){
    case 'refresh': return toast('已刷新当前页数据（原型示意）');
    case 'logout': return toast('原型中不执行退出');
    case 'pool': S.chat.pool = v; S.chat.policy = POOLS[v] && POOLS[v].main ? 'direct' : S.chat.policy; return render();
    case 'chat-primary': {
      const p = POOLS[S.chat.pool];
      if(p){ p.main = !p.main; S.chat.policy = p.main ? 'direct' : S.chat.policy; }
      return toast(p && p.main ? '已设为主聊天：任务汇报只发这里，永不审批' : '已取消主聊天');
    }
    case 'chat-archive': { const p = POOLS[S.chat.pool]; if(p){ p.archived = !p.archived; } return toast(p && p.archived ? '已归档（原型示意）' : '已取消归档（原型示意）'); }
    case 'chat-older': return toast('已尝试加载更早消息（原型示意）');
    case 'chat-bottom': return toast('已回到最新');
    case 'task-open': S.drawer = {kind:'task', id:Number(v), tab:'detail'}; S.rejectReason = ''; return render();
    case 'close-drawer': S.drawer = null; return render();
    case 'task-tab': S.drawer.tab = v; return render();
    case 'task-approve': S.modal = {kind:'approve', id: S.drawer ? Number(S.drawer.id) : 0}; return render();
    case 'modal-close': S.modal = null; return render();
    case 'modal-confirm-approve': {
      const id = Number(v);
      S.tasks.overrides[id] = 'running';
      S.modal = null; S.drawer = null;
      return toast('任务 #' + id + ' 已通过并启动（原型示意）');
    }
    case 'task-reject': {
      if(!String(S.rejectReason || '').trim()) return toast('驳回原因必填', 'error');
      const id = S.drawer.id;
      S.tasks.overrides[id] = 'cancelled';
      S.rejectReason = ''; S.drawer = null;
      return toast('任务 #' + id + ' 已驳回（原型示意）');
    }
    case 'outputs-dir': S.outputs.open[v] = !S.outputs.open[v]; return render();
    case 'outputs-file': S.outputs.file = v; return render();
    case 'outputs-copy': {
      const f = fileByPath(S.outputs.file);
      if(f && navigator.clipboard){ navigator.clipboard.writeText(f.path).catch(() => {}); }
      return toast('已复制路径：' + (f ? f.path : ''));
    }
    case 'outputs-reload': return toast('已重新加载预览（原型示意）');
    case 'approval-sel': S.approvals.sel = Number(v); return render();
    case 'goto-task': S.tab = 'tasks'; S.drawer = {kind:'task', id:Number(v), tab:'detail'}; return render();
    case 'plan-goal': {
      const parts = String(v).split('|'); const b = PLANS.find(x => x.slug === parts[0]); const i = Number(parts[1]);
      if(b && b.goals[i]) b.goals[i].done = !b.goals[i].done;
      return render();
    }
    case 'plan-progress': {
      const b = PLANS.find(x => x.slug === v); const draft = String(S.plans.drafts[v] || '').trim();
      if(!b) return;
      if(!draft) return toast('进展不能为空', 'error');
      b.progress.push({at:'11-13 11:52', text:draft});
      S.plans.drafts[v] = '';
      return toast('已记录进展（原型示意）');
    }
    case 'plan-done': { const b = PLANS.find(x => x.slug === v); if(b) b.status = 'done'; return toast('已标完成（原型示意）'); }
    case 'plan-archive': { const b = PLANS.find(x => x.slug === v); if(b) b.status = 'archived'; return toast('已归档（原型示意）'); }
    case 'plan-new': S.plans.showNew = !S.plans.showNew; S.drawer = S.plans.showNew ? {kind:'plan-new'} : null; return render();
    case 'plan-close': S.plans.showNew = false; S.drawer = null; return render();
    case 'plan-create': {
      if(!String(S.plans.newTitle || '').trim()) return toast('计划标题不能为空', 'error');
      PLANS.unshift({slug:'plan:new-' + (PLANS.length + 1), title:S.plans.newTitle.trim(), status:'active', background:S.plans.newBackground.trim(), goals:String(S.plans.newGoals || '').split('\n').map(x => x.trim()).filter(Boolean).map(text => ({text, done:false})), progress:[]});
      S.plans.newTitle = ''; S.plans.newBackground = ''; S.plans.newGoals = ''; S.plans.showNew = false; S.drawer = null;
      return toast('计划已创建（原型示意）');
    }
    case 'mem-sel': S.memories.sel = Number(v); S.memories.editing = false; S.memories.trace = null; return render();
    case 'mem-edit': { const m = MEMORIES.find(x => x.id === S.memories.sel); S.memories.draft = m ? m.content : ''; S.memories.editing = true; return render(); }
    case 'mem-cancel': S.memories.editing = false; return render();
    case 'mem-save': {
      const m = MEMORIES.find(x => x.id === S.memories.sel);
      const text = String(S.memories.draft || '').trim();
      if(!text) return toast('正文不能为空；不想留了就删除', 'error');
      if(m) m.content = text;
      S.memories.editing = false;
      return toast('已保存（原型示意）');
    }
    case 'mem-delete': S.modal = {kind:'delete-memory', id:S.memories.sel}; return render();
    case 'modal-confirm-delete': { const id = Number(v); const i = MEMORIES.findIndex(x => x.id === id); if(i >= 0) MEMORIES.splice(i,1); S.modal = null; if(S.memories.sel === id) S.memories.sel = MEMORIES[0] ? MEMORIES[0].id : 0; return toast('已删除（原型示意）'); }
    case 'mem-trace': S.memories.trace = S.memories.sel; return render();
    case 'mem-untrace': S.memories.trace = null; return render();
    case 'biz-cat': S.business.cat = v; { const it = bizItems()[0]; if(it) S.business.sel = {kind:it.kind, id:it.id}; } return render();
    case 'biz-sel': { const parts = String(v).split('|'); S.business.sel = {kind:parts[0], id:parts.slice(1).join('|')}; return render(); }
    case 'manage-view': S.manage.view = v; return render();
    case 'manage-session': S.manage.session = v; return render();
    case 'persona-select': { const p = PROMPTS.find(x => x.name === v); S.manage.prompt = v; S.manage.personaDraft = p ? p.content : ''; S.manage.personaDirty = false; return render(); }
    case 'persona-save': {
      if(!S.manage.personaDirty) return;
      const p = PROMPTS.find(x => x.name === S.manage.prompt);
      if(p) p.content = S.manage.personaDraft;
      S.manage.personaDirty = false;
      return toast('提示词已保存，下一轮生效（原型示意）');
    }
    case 'user-save': return toast('别名已保存并回填（原型示意）');
    case 'schedule-new': S.manage.scheduleNew = !S.manage.scheduleNew; return render();
    case 'schedule-create': {
      const sc = S.manage.schedule;
      if(!String(sc.title || '').trim()) return toast('日程标题必填', 'error');
      if(!String(sc.content || '').trim()) return toast('日程内容必填', 'error');
      SCHEDULES.unshift({id:SCHEDULES.length + 1, title:sc.title.trim(), kind:sc.kind, when:sc.kind === 'cron' ? 'cron ' + sc.cron : '创建后 ' + sc.delay + ' 分钟', content:sc.content.trim(), status:'active', updated:'11-13 11:55'});
      S.manage.schedule = {title:'', content:'', kind:'cron', cron:'0 9 * * *', delay:'10'};
      S.manage.scheduleNew = false;
      return toast('日程已创建（原型示意）');
    }
    case 'settings-save': {
      if(!S.manage.settingsDirty) return;
      S.manage.settingsDirty = false;
      return toast('调度设置已保存，立即生效（原型示意）');
    }
    default: return;
  }
}

/* 初始化 */
S.manage.personaDraft = PROMPTS[0].content;
S.rejectReason = '';
render();
</script>
</body>
</html>
