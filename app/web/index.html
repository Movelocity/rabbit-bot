<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Rabbit Bot 管理台</title>
  <link rel="stylesheet" href="/ui/style.css">
  <script src="/ui/app.js" defer></script>
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card">
      <div class="login-mark">RB</div>
      <h1>Rabbit Bot 管理台</h1>
      <p class="muted">
        输入本地 REST API token。默认从
        <code>app/data/run/api.token</code>
        读取，也可以用环境变量 <code>RABBIT_BOT_API_TOKEN</code>。
      </p>
      <label for="token-input">API token</label>
      <input id="token-input" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴 token">
      <p id="login-error" class="error hidden"></p>
      <button type="submit" class="primary">连接</button>
      <p class="login-foot muted">会话收发走已启用的 IM；这里管理人格、提示词、记忆、调度和只读面板。页面可以匿名打开，但所有数据接口都要 token。</p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">RB</span>
        <span>Rabbit Bot 管理台</span>
        <span class="readonly-chip">本地管理</span>
      </div>
      <div class="conn">
        <span id="health-dot" class="dot"></span>
        <span id="health-text">连接中…</span>
        <span class="sep">·</span>
        <span id="base-url" class="muted"></span>
      </div>
      <button id="logout" class="ghost small" type="button">退出</button>
    </header>

    <nav class="tabs" aria-label="功能页签">
      <button type="button" data-tab="chat" class="active">会话</button>
      <button type="button" data-tab="tasks">任务</button>
      <button type="button" data-tab="approvals">权限</button>
      <button type="button" data-tab="plans">计划</button>
      <button type="button" data-tab="memories">记忆</button>
      <button type="button" data-tab="business">业务知识</button>
      <button type="button" data-tab="manage">管理</button>
      <button id="reload-current" class="ghost small tab-refresh" type="button" aria-label="刷新当前页" title="刷新当前页">刷新</button>
    </nav>

    <main class="main">
      <section id="tab-chat" class="tab-panel active chat-layout">
        <aside class="pools">
          <div class="pools-head">
            <span>会话池</span>
          </div>
          <div id="pool-list" class="pool-list"></div>
        </aside>

        <section class="conversation" aria-label="会话记录">
          <div class="conv-head">
            <button id="back-to-pools" class="ghost small" type="button">会话列表</button>
            <div class="conv-title-wrap">
              <h2 id="conv-title">选择左侧会话</h2>
              <div id="conv-meta" class="conv-meta muted"></div>
            </div>
          </div>
          <p id="chat-status" class="chat-status hidden" role="status"></p>
          <div id="messages" class="messages" tabindex="0" aria-label="消息记录"></div>
          <div class="conversation-foot"><span>只读 · 收发走已启用的 IM</span><button id="jump-latest" class="ghost small" type="button">回到最新</button></div>
        </section>
      </section>

      <section id="tab-tasks" class="tab-panel" data-hint="飞书审批为主 · Web 备用">
        <div class="filter-row">
          <label class="field compact">
            <span>status</span>
            <select id="task-status-filter">
              <option value="">全部</option>
              <option value="pending_approval">pending_approval</option>
              <option value="pending">pending</option>
              <option value="running">running</option>
              <option value="blocked">blocked</option>
              <option value="done">done</option>
              <option value="failed">failed</option>
              <option value="cancelled">cancelled</option>
            </select>
          </label>
          <label class="field compact">
            <span>executor</span>
            <select id="task-executor-filter">
              <option value="">全部</option>
              <option value="opencode">opencode</option>
              <option value="mimo">mimo</option>
            </select>
          </label>
          <label class="field grow">
            <span>搜索</span>
            <input id="task-search" type="search" placeholder="id / 任务名 / 目标 / worker / note">
          </label>
        </div>
        <p id="tasks-status" class="status"></p>
        <div id="tasks-list" class="cards"></div>
        <div id="tasks-pager" class="pager" hidden></div>
      </section>

      <section id="tab-approvals" class="tab-panel" data-hint="只读 · 审批请在飞书里完成">
        <div class="filter-row">
          <label class="field compact">
            <span>status</span>
            <select id="approval-status-filter">
              <option value="pending">pending</option>
              <option value="">全部</option>
              <option value="approved">approved</option>
              <option value="rejected">rejected</option>
              <option value="timeout">timeout</option>
            </select>
          </label>
        </div>
        <p id="approvals-status" class="status"></p>
        <div id="approvals-list" class="cards"></div>
      </section>

      <section id="tab-plans" class="tab-panel" data-hint="只读 · 新增/完成走 IM">
        <p id="plans-status" class="status"></p>
        <div id="plans-list" class="cards"></div>
      </section>

      <section id="tab-memories" class="tab-panel" data-hint="可直接改正文或删除 · 新增/过期走 IM">
        <div class="memory-toolbar">
          <label class="field">
            <span>当前池</span>
            <input id="mem-pool" type="text" readonly placeholder="先在会话页选一个池">
          </label>
          <label class="field">
            <span>用户 user id</span>
            <input id="mem-user" type="text" readonly placeholder="当前池暂无已识别用户">
          </label>
        </div>
        <p id="mem-status" class="status"></p>
        <div id="mem-list" class="cards"></div>
      </section>

      <section id="tab-business" class="tab-panel" data-hint="只读 · runtime/business">
        <div class="business-toolbar">
          <label class="field compact">
            <span>搜索</span>
            <input id="business-search" type="search" placeholder="对象 / 关系 / 术语">
          </label>
          <div class="segmented" id="business-view-switch" aria-label="业务知识视图">
            <button type="button" data-business-view="list" class="active">列表</button>
            <button type="button" data-business-view="graph">关系图</button>
          </div>
        </div>
        <div id="business-summary" class="business-summary"></div>
        <p id="business-status" class="status"></p>
        <div id="business-list-view" class="business-layout">
          <aside class="business-sidebar">
            <nav id="business-categories" class="business-categories" aria-label="业务知识分类"></nav>
            <div id="business-items" class="business-items"></div>
          </aside>
          <div id="business-detail" class="business-detail"></div>
        </div>
        <div id="business-graph-view" class="business-graph-layout" hidden>
          <div class="business-graph-main">
            <div id="business-graph" class="business-graph"></div>
            <p id="business-graph-note" class="business-graph-note muted"></p>
          </div>
          <aside id="business-graph-detail" class="business-detail"></aside>
        </div>
      </section>

      <section id="tab-manage" class="tab-panel manage-layout">
        <aside class="manage-menu">
          <button type="button" data-manage="workers" class="active">Worker</button>
          <button type="button" data-manage="users">用户</button>
          <button type="button" data-manage="persona">人格</button>
          <button type="button" data-manage="settings">调度</button>
          <button type="button" data-manage="usage">用量</button>
          <button type="button" data-manage="skills">技能</button>
        </aside>
        <div class="manage-content">
          <section id="manage-workers" class="manage-view active" data-hint="只读 · 在线状态与心跳">
            <p id="workers-status" class="status"></p>
            <div id="workers-list" class="cards"></div>
          </section>

          <section id="manage-users" class="manage-view" data-hint="别名优先于通讯录名字">
            <p id="users-status" class="status"></p>
            <div id="users-list" class="cards"></div>
          </section>

          <section id="manage-persona" class="manage-view" data-hint="保存到运行时 · 下一轮换新会话生效">
            <p id="persona-status" class="status"></p>
            <div class="editor-grid">
              <label class="editor-card">
                <span class="editor-label">人设 <span id="persona-path" class="muted"></span></span>
                <textarea id="persona-editor" spellcheck="false" rows="18"></textarea>
                <div class="editor-actions">
                  <button id="save-persona" class="primary small" type="button">保存人设</button>
                </div>
              </label>
              <label class="editor-card">
                <span class="editor-label">系统提示词 <span id="prompt-path" class="muted"></span></span>
                <textarea id="prompt-editor" spellcheck="false" rows="18"></textarea>
                <div class="editor-actions">
                  <button id="save-prompt" class="primary small" type="button">保存系统提示词</button>
                </div>
              </label>
            </div>
          </section>

          <section id="manage-settings" class="manage-view" data-hint="单位：秒 · 保存后立即生效">
            <div class="memory-toolbar">
              <label class="field">
                <span>私聊唤醒间隔（秒）</span>
                <input id="scheduler-private" type="number" min="1" step="1">
              </label>
              <label class="field">
                <span>群聊唤醒间隔（秒）</span>
                <input id="scheduler-group" type="number" min="1" step="1">
              </label>
              <label class="field">
                <span>任务群唤醒间隔（秒）</span>
                <input id="scheduler-task" type="number" min="1" step="1">
              </label>
            </div>
            <div class="filter-row">
              <button id="save-scheduler" class="primary" type="button">保存</button>
            </div>
            <p id="scheduler-status" class="status"></p>
          </section>

          <section id="manage-usage" class="manage-view">
        <div class="filter-row">
          <label class="field compact">
            <span>粒度</span>
            <select id="usage-bucket">
              <option value="hour">按小时</option>
              <option value="day">按天</option>
            </select>
          </label>
          <label class="field compact">
            <span>范围</span>
            <select id="usage-range">
              <option value="24h">最近 24 小时</option>
              <option value="7d">7 天</option>
              <option value="30d">30 天</option>
            </select>
          </label>
        </div>
        <div id="usage-summary" class="usage-summary"></div>
        <div id="usage-chart" class="usage-chart"></div>
        <div id="usage-calls" class="usage-calls"></div>
        <p id="usage-status" class="status"></p>
          </section>

          <section id="manage-skills" class="manage-view" data-hint="只读 · 技能只做发现">
        <p id="skills-status" class="status"></p>
        <div id="skills-list" class="cards"></div>
          </section>

        </div>
      </section>
    </main>
    <footer id="app-foot" class="app-foot" hidden></footer>
  </div>

  <div id="task-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
    <div class="modal-backdrop" data-close-task-modal></div>
    <div class="modal-panel" role="document">
      <div class="modal-head">
        <h2 id="task-modal-title">任务详情</h2>
        <button id="task-modal-close" class="ghost small" type="button" aria-label="关闭任务详情">关闭</button>
      </div>
      <div id="task-modal-body" class="modal-body"></div>
    </div>
  </div>
</body>
</html>
